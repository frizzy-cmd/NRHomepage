<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="title" content="admin - s's Homepage">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="theme-color" content="#5a207f">

	<link rel="icon" type="image/png" href="static/img/icon.png">
	<link rel="stylesheet" href="static/styles.css">
	<script src="static/js/theme-switcher.js"></script>
	<script src="static/js/admin-panel.js"></script>
	<script src="static/js/alert-sound.js"></script>
	<title>admin.Panel- Nightregion's Homepage</title>

	<style>
		.admin-box {
			background: rgba(18, 6, 28, 0.9);
			border: 3px solid var(--box-border);
			padding: 24px;
			border-radius: 6px;
			margin-bottom: 20px;
		}

		.status-badge {
			display: inline-block;
			padding: 4px 12px;
			font-size: 14pt;
			font-weight: bold;
			border-radius: 4px;
			margin-left: 8px;
		}

		.status-online {
			background: #1b5e20;
			color: #a5d6a7;
			border: 1px solid #2e7d32;
		}

		.status-offline {
			background: #b71c1c;
			color: #ffcdd2;
			border: 1px solid #ff5252;
		}
	</style>
</head>

<body>
	<div id="header">
		<a href="index.html" style="text-decoration: none;">
			<img id="logo" src="static/img/logo.png" alt="OneShot Logo">
		</a>
		<div id="subtitle">adminPanel</div>
	</div>

	<div id="box">
		<div id="loginGate" class="admin-box" style="text-align: center;">
			<h3>Auth</h3>
			<input type="password" id="adminPwd" placeholder="enter pw" style="width: 100%; margin-bottom: 12px;">
			<button class="btn" onclick="loginAdmin()" style="width: 100% !important; margin: 0;">Login</button>
		</div>

		<!-- CONTROLS START -->
		<div id="adminControls" style="display: none;">
			<!-- maintenance -->
			<div class="admin-box">
				<h3>Status: <span id="currentStatusBadge" class="status-badge status-online">OK | ONLINE</span></h3>

				<label style="display:block; margin: 12px 0 4px 0;">Downtime note (for unavail.html):</label>
				<input type="text" id="maintenanceNoteInput" placeholder="maintenance or sumn like that.."
					style="width: 100%; margin-bottom: 12px;">

				<div style="display: flex; gap: 10px;">
					<button class="btn" onclick="setSiteStatus('offline')"
						style="background: #b71c1c; border-color: #5f0909; margin: 0; flex: 1;">Set OFFLINE</button>
					<button class="btn" onclick="setSiteStatus('online')"
						style="background: #2e7d32; border-color: #113813; margin: 0; flex: 1;">Set ONLINE</button>
				</div>
			</div>

			<!-- announcement -->
			<div class="admin-box">
				<h3>Announcement</h3>

				<label style="display:block; margin: 8px 0 4px 0;">Announcement msg:</label>
				<input type="text" id="announcementTextInput" placeholder="e.g. gay"
					style="width: 100%; margin-bottom: 12px;">

				<div style="display: flex; gap: 16px; margin-bottom: 12px; align-items: center;">
					<div>
						<label style="font-size: 11pt;">Timer (min only, 0 = inft):</label>
						<input type="number" id="announcementDuration" value="0" min="0" style="width: 80px;">
					</div>
					<div>
						<label style="font-size: 11pt; cursor: pointer;">
							<input type="checkbox" id="announcementClosable" checked> allow usrs to close?
						</label>
					</div>
				</div>

				<div style="display: flex; gap: 10px;">
					<button class="btn" onclick="publishAnnouncement()" style="margin: 0; flex: 1;">Signal
						announcement</button>
					<button class="btn" onclick="clearAnnouncement()"
						style="background: #424242; border-color: #1b1b1b; margin: 0; flex: 1;">Clear
						announcement</button>
				</div>
			</div>

			<!-- linky -->
			<div class="admin-box">
				<h3>OneMsg panel</h3>
				<a href="onemsg-admin.html" class="btn" style="text-decoration: none; margin: 0;">Open</a>
			</div>
			<!-- analytics -->
			<div class="admin-box">
				<h3>Site Analytics</h3>
				<button class="btn" onclick="loadAnalytics()"
					style="margin: 0 0 16px 0; width: 100% !important;">Refresh Analytics</button>

				<div id="analyticsContent" style="display:none;">
					<p style="text-align:center; font-size: 13pt;">
						Total views: <strong id="anTotalViews" style="color: var(--header-subtitle);">0</strong>
						&nbsp;|&nbsp;
						Avg time on page: <strong id="anAvgTime" style="color: var(--header-subtitle);">0s</strong>
					</p>

					<h4 style="text-align:left; font-size: 13pt; margin: 20px 0 8px 0;">Top pages</h4>
					<table style="font-size: 11pt;">
						<thead>
							<tr>
								<td><strong>Path</strong></td>
								<td><strong>Views</strong></td>
								<td><strong>Avg time</strong></td>
							</tr>
						</thead>
						<tbody id="anTopPages"></tbody>
					</table>

					<h4 style="text-align:left; font-size: 13pt; margin: 20px 0 8px 0;">Daily views (last 14d)</h4>
					<table style="font-size: 11pt;">
						<thead>
							<tr>
								<td><strong>Day</strong></td>
								<td><strong>Views</strong></td>
							</tr>
						</thead>
						<tbody id="anDailyViews"></tbody>
					</table>

					<h4 style="text-align:left; font-size: 13pt; margin: 20px 0 8px 0;">Referrers</h4>
					<table style="font-size: 11pt;">
						<thead>
							<tr>
								<td><strong>Source</strong></td>
								<td><strong>Count</strong></td>
							</tr>
						</thead>
						<tbody id="anReferrers"></tbody>
					</table>

					<div style="display: flex; gap: 20px; margin-top: 20px;">
						<div style="flex:1;">
							<h4 style="text-align:left; font-size: 13pt; margin: 0 0 8px 0;">Viewport</h4>
							<table style="font-size: 11pt;">
								<tbody id="anViewports"></tbody>
							</table>
						</div>
						<div style="flex:1;">
							<h4 style="text-align:left; font-size: 13pt; margin: 0 0 8px 0;">Theme</h4>
							<table style="font-size: 11pt;">
								<tbody id="anThemes"></tbody>
							</table>
						</div>
					</div>

					<h4 style="text-align:left; font-size: 13pt; margin: 20px 0 8px 0;">Top clicks</h4>
					<table style="font-size: 11pt;">
						<thead>
							<tr>
								<td><strong>Path</strong></td>
								<td><strong>Tag</strong></td>
								<td><strong>Label</strong></td>
								<td><strong>Count</strong></td>
							</tr>
						</thead>
						<tbody id="anTopClicks"></tbody>
					</table>
				</div>
			</div>

		</div>
	</div>
	<script>
		// analytics..

		function anEsc(str) {
			if (!str) return '';
			return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
		}

		function loadAnalytics() {
			var pwd = sessionStorage.getItem('kip_admin_token');
			if (!pwd) {
				alert('Log in first.');
				return;
			}

			fetch('/api/admin/analytics/summary', {
				headers: { 'X-Admin-Key': pwd }
			})
				.then(function (res) { return res.json(); })
				.then(function (data) {
					if (data.error) {
						alert('Analytics error: ' + data.error);
						return;
					}

					document.getElementById('analyticsContent').style.display = 'block';
					document.getElementById('anTotalViews').innerText = data.totals.totalViews || 0;
					document.getElementById('anAvgTime').innerText = Math.round(data.totals.avgTimeAll || 0) + 's';

					var tp = '';
					for (var i = 0; i < data.topPages.length; i++) {
						var p = data.topPages[i];
						tp += '<tr><td>' + anEsc(p.path) + '</td><td>' + p.views + '</td><td>' + Math.round(p.avgTime || 0) + 's</td></tr>';
					}
					document.getElementById('anTopPages').innerHTML = tp || '<tr><td colspan="3">no data yet</td></tr>';

					var dv = '';
					for (var i = 0; i < data.dailyViews.length; i++) {
						var d = data.dailyViews[i];
						dv += '<tr><td>' + anEsc(d.day) + '</td><td>' + d.cnt + '</td></tr>';
					}
					document.getElementById('anDailyViews').innerHTML = dv || '<tr><td colspan="2">no data yet</td></tr>';

					var rf = '';
					for (var i = 0; i < data.referrers.length; i++) {
						var r = data.referrers[i];
						rf += '<tr><td>' + anEsc(r.referrer) + '</td><td>' + r.cnt + '</td></tr>';
					}
					document.getElementById('anReferrers').innerHTML = rf || '<tr><td colspan="2">no data yet</td></tr>';

					var vp = '';
					for (var i = 0; i < data.viewports.length; i++) {
						var v = data.viewports[i];
						vp += '<tr><td>' + anEsc(v.viewport) + '</td><td>' + v.cnt + '</td></tr>';
					}
					document.getElementById('anViewports').innerHTML = vp || '<tr><td>no data</td></tr>';

					var th = '';
					for (var i = 0; i < data.themes.length; i++) {
						var t = data.themes[i];
						th += '<tr><td>' + anEsc(t.theme) + '</td><td>' + t.cnt + '</td></tr>';
					}
					document.getElementById('anThemes').innerHTML = th || '<tr><td>no data</td></tr>';

					var tc = '';
					for (var i = 0; i < data.topClicks.length; i++) {
						var c = data.topClicks[i];
						tc += '<tr><td>' + anEsc(c.path) + '</td><td>' + anEsc(c.tag) + '</td><td>' + anEsc(c.label) + '</td><td>' + c.cnt + '</td></tr>';
					}
					document.getElementById('anTopClicks').innerHTML = tc || '<tr><td colspan="4">no data yet</td></tr>';
				})
				.catch(function (e) {
					alert('Fail load analytics: ' + e.message);
				});
		}
	</script>
</body>

</html>
