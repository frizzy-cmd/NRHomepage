<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="title" content="Admin Control Panel - Kip's Homepage">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<meta name="theme-color" content="#5a207f">

		<link rel="icon" type="image/png" href="static/img/icon.png">
		<link rel="stylesheet" href="static/styles.css">
		<script src="static/js/theme-switcher.js"></script>
        <script src="static/js/admin-panel.js"></script>
		<title>admin.Panel- Kip's Homepage</title>

		<style>
			.admin-box {
				background: rgba(18, 6, 28, 0.9);
				border: 3px solid var(--box-border);
				padding: 24px;
				border-radius: 6px;
				margin-bottom: 20px;
			}
			.status-badge {
				display: inline-block;
				padding: 4px 12px;
				font-size: 14pt;
				font-weight: bold;
				border-radius: 4px;
				margin-left: 8px;
			}
			.status-online { background: #1b5e20; color: #a5d6a7; border: 1px solid #2e7d32; }
			.status-offline { background: #b71c1c; color: #ffcdd2; border: 1px solid #ff5252; }
		</style>
	</head>
	<body>
		<div id="header">
			<a href="index.html" style="text-decoration: none;">
				<img id="logo" src="static/img/logo.png" alt="OneShot Logo">
			</a>
			<div id="subtitle">adminPanel</div>
		</div>

		<div id="box">
			<div id="loginGate" class="admin-box" style="text-align: center;">
				<h3>Auth</h3>
				<input type="password" id="adminPwd" placeholder="enter pw" style="width: 100%; margin-bottom: 12px;">
				<button class="btn" onclick="loginAdmin()" style="width: 100% !important; margin: 0;">Login</button>
			</div>

            <!-- CONTROLS START -->
			<div id="adminControls" style="display: none;">
				<!-- maintenance -->
				<div class="admin-box">
					<h3>Status: <span id="currentStatusBadge" class="status-badge status-online">OK | ONLINE</span></h3>
					
					<label style="display:block; margin: 12px 0 4px 0;">Downtime note (for unavail.html):</label>
					<input type="text" id="maintenanceNoteInput" placeholder="maintenance or sumn like that.." style="width: 100%; margin-bottom: 12px;">

					<div style="display: flex; gap: 10px;">
						<button class="btn" onclick="setSiteStatus('offline')" style="background: #b71c1c; border-color: #5f0909; margin: 0; flex: 1;">Set OFFLINE</button>
						<button class="btn" onclick="setSiteStatus('online')" style="background: #2e7d32; border-color: #113813; margin: 0; flex: 1;">Set ONLINE</button>
					</div>
				</div>

				<!-- announcement -->
				<div class="admin-box">
					<h3>Announcement</h3>

					<label style="display:block; margin: 8px 0 4px 0;">Announcement msg:</label>
					<input type="text" id="announcementTextInput" placeholder="e.g. gay" style="width: 100%; margin-bottom: 12px;">

					<div style="display: flex; gap: 16px; margin-bottom: 12px; align-items: center;">
						<div>
							<label style="font-size: 11pt;">Timer (min only, 0 = inft):</label>
							<input type="number" id="announcementDuration" value="0" min="0" style="width: 80px;">
						</div>
						<div>
							<label style="font-size: 11pt; cursor: pointer;">
								<input type="checkbox" id="announcementClosable" checked> allow usrs to close?
							</label>
						</div>
					</div>

					<div style="display: flex; gap: 10px;">
						<button class="btn" onclick="publishAnnouncement()" style="margin: 0; flex: 1;">Signal announcement</button>
						<button class="btn" onclick="clearAnnouncement()" style="background: #424242; border-color: #1b1b1b; margin: 0; flex: 1;">Clear announcement</button>
					</div>
				</div>

				<!-- linky -->
				<div class="admin-box">
					<h3>OneMsg panel</h3>
					<a href="onemsg-admin.html" class="btn" style="text-decoration: none; margin: 0;">Open</a>
				</div>
			</div>
		</div>
	</body>
</html>
